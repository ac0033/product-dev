name: Plugin checks

# 降低 CI 频率：草稿 PR 不跑（转为可审阅时跑）；只改 docs/ 下 Markdown 的 PR 跳过测试；同一 PR 的新提交取消上一次未完成的运行。
# 推送到 main、release/** 不设跳过条件，每次合并后全量再跑一次兜底；每次推送各占一个并发组，排队中的运行不会被后一次推送顶掉。
# 是否只改文档由 changes 作业判断：git diff --no-renames（改名按旧路径删除加新路径新增算）、-z 输出（中文路径不被转义），
# 用 Node 的 path.matchesGlob 匹配（与工程套件的闸门同一套 glob 语义）；不用 paths-ignore（它对改名只看新路径，大 PR 还有 300 文件的比较上限）。
# 仓库当前没有必需检查（无分支保护、无 ruleset），被跳过的测试不会拦住合并；日后开分支保护时，加一个始终运行的汇总作业再设必需检查。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IGNORE: '["docs/**/*.md"]'
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c core.quotepath=false diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          node -e "const { matchesGlob } = require('node:path'); const files = require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/changed.txt', 'utf8').split('\0').filter(Boolean); const ignore = JSON.parse(process.env.IGNORE); console.log('code=' + (files.length === 0 || files.some((f) => !ignore.some((g) => matchesGlob(f, g)))));" >> "$GITHUB_OUTPUT"

  test:
    name: Plugin tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: evals
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="${{ runner.temp }}/junit-evals.xml" evals/*.test.mjs
      - id: kit
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="${{ runner.temp }}/junit-kit.xml" tests/*.test.mjs
        working-directory: components/engineering-kit/kit
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: node tools/package-release.mjs dist
      # 测试台账（只报告）：两步测试的 JUnit 报告按测试文件记成 ek-test-ledger/1，作为产物上传；本机用套件的 test-ledger.mjs pull --pr <编号> 拉回。
      # 本仓库没有 engineering.config.json，记录步骤不读配置，层级记“未分层”。记录失败不影响作业结论。
      - name: Test ledger
        if: always() && (steps.evals.outcome == 'success' || steps.evals.outcome == 'failure')
        continue-on-error: true
        shell: bash
        env:
          OUTCOME: ${{ steps.evals.outcome == 'success' && steps.kit.outcome == 'success' && '0' || '1' }}
        run: node components/engineering-kit/kit/gate/test-ledger.mjs record --source ci --exit-code "$OUTCOME" --junit "${{ runner.temp }}/junit-evals.xml" --junit "${{ runner.temp }}/junit-kit.xml" --os "${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}" --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}" --mode full --out "${{ runner.temp }}/test-ledger-${{ matrix.os }}.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: test-ledger-${{ matrix.os }}
          path: ${{ runner.temp }}/test-ledger-${{ matrix.os }}.jsonl
          if-no-files-found: ignore
